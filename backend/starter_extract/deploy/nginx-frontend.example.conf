# EXEMPLO DE BLOCO HTTP PARA REVISÃO — NÃO APLICAR SOBRE O NGINX EXISTENTE SEM MESCLAR TLS.
# O bloco atual do Certbot/Let's Encrypt deve ser preservado e o root deve apontar para dist/.
# Mantenha o server HTTPS e os caminhos de certificado já instalados.

server {
    listen 80;
    listen [::]:80;
    server_name bipmanager.duckdns.org;
    return 301 https://$host$request_uri;
}

